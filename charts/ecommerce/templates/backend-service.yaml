apiVersion: v1
kind: Service
metadata:
  name: ecommerce-backend
spec:
  selector:
    app: ecommerce-backend
  ports:
  - port: {{ index .Values.services "backend" "port" }}
    targetPort: {{ index .Values.services "backend" "targetPort" }}
  type: {{ index .Values.services "backend" "type" | default "ClusterIP" }}