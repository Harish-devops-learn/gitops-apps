apiVersion: v1
kind: Service
metadata:
  name: ecommerce-frontend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  selector:
    app: ecommerce-frontend
  ports:
  - port: {{ index .Values.services "frontend" "port" }}
    targetPort: {{ index .Values.services "frontend" "targetPort" }}
  type: {{ index .Values.services "frontend" "type" | default "LoadBalancer" }}